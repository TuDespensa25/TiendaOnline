<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel — TuDespensa25</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../estilos/tokens.css">
  <link rel="stylesheet" href="../estilos/tienda.css">
  <link rel="stylesheet" href="../estilos/admin.css">
</head>
<body>

<!-- Entrar -->
<section class="entrar" id="entrar">
  <form class="entrar__caja" id="form-entrar">
    <img src="../favicon.png" alt="" width="56" height="56" class="entrar__logo">
    <h1 class="td-titulo entrar__titulo">Panel de TuDespensa25</h1>

    <label class="campo">
      <span class="campo__etiqueta">Correo</span>
      <input class="td-campo" id="correo" type="email" autocomplete="username" required>
    </label>

    <label class="campo">
      <span class="campo__etiqueta">Contraseña</span>
      <input class="td-campo" id="clave" type="password" autocomplete="current-password" required>
    </label>

    <p class="entrar__error" id="error-entrar" hidden></p>
    <button class="td-boton entrar__boton" type="submit" id="btn-entrar">Entrar</button>
  </form>
</section>

<!-- Panel -->
<div id="panel" hidden>
  <header class="cabecera">
    <img class="cabecera__logo" src="../favicon.png" alt="" width="40" height="40">
    <h1 class="td-titulo cabecera__titulo">Productos</h1>
    <button class="admin__salir" id="btn-salir" type="button">Salir</button>
  </header>

  <div class="admin__barra">
    <div class="buscador">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
        <path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/>
      </svg>
      <input id="buscar-admin" class="buscador__campo" type="search" placeholder="Buscar producto..." autocomplete="off">
    </div>
    <span class="admin__cuenta" id="cuenta-admin"></span>
  </div>

  <div class="admin__lista" id="lista-admin" aria-live="polite"></div>
</div>

<!-- Editar -->
<dialog class="cajon" id="cajon">
  <form class="cajon__cuerpo" method="dialog">
    <div class="cajon__cabecera">
      <h2 class="td-titulo cajon__titulo" id="cajon-titulo">Editar producto</h2>
      <button class="cajon__cerrar" type="button" id="cajon-x" aria-label="Cerrar">×</button>
    </div>

    <div class="cajon__scroll">
      <span class="campo__etiqueta">Foto del producto</span>
      <label class="soltar" id="soltar">
        <img id="vista-previa" alt="" hidden>
        <span id="soltar-texto">Toca para elegir una foto del teléfono</span>
        <input type="file" id="archivo" accept="image/*" hidden>
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Nombre</span>
        <input class="td-campo" id="e-nombre" type="text">
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Descripción</span>
        <input class="td-campo" id="e-descripcion" type="text">
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Categoría</span>
        <select class="td-campo" id="e-categoria"></select>
      </label>

      <div class="campos-par">
        <label class="campo">
          <span class="campo__etiqueta">Precio USD</span>
          <input class="td-campo" id="e-precio" type="number" step="0.01" min="0" inputmode="decimal">
        </label>
        <label class="campo">
          <span class="campo__etiqueta">Descuento %</span>
          <input class="td-campo" id="e-descuento" type="number" step="1" min="0" max="99" inputmode="numeric">
        </label>
      </div>

      <p class="calculado" id="calculado"></p>

      <label class="interruptor">
        <input type="checkbox" id="e-visible">
        <span>Visible en la tienda</span>
      </label>
    </div>

    <div class="cajon__pie">
      <p class="cajon__error" id="error-guardar" hidden></p>
      <button class="td-boton td-boton--suave" type="button" id="cancelar">Cancelar</button>
      <button class="td-boton" type="button" id="guardar">Guardar</button>
    </div>
  </form>
</dialog>

<script src="../utils/config.js"></script>
<script src="../utils/imagenes.js"></script>
<script src="../utils/datos.js"></script>
<script src="../utils/sesion.js"></script>
<script src="admin.js"></script>
</body>
</html>
